appId: dev.createflow.dongle
productName: createflow Dongle
# The npm package name would otherwise become the install folder on Windows.
extraMetadata:
  name: createflow-dongle
copyright: "Copyright © 2026 Sünkel Media & Merch\nFür Jesus. Für Menschen."
artifactName: "createflow-dongle-${version}-${os}-${arch}.${ext}"
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# The firmware package sits next to the app (process.resourcesPath/firmware), outside the
# asar, so it can be swapped without rebuilding.
extraResources:
  - from: firmware
    to: firmware
# serialport ships prebuilt N-API binaries; no rebuild, and the .node files must stay
# outside the asar.
npmRebuild: false
asarUnpack:
  - "**/node_modules/@serialport/bindings-cpp/**"
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization uses APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER from the
  # environment (see README); without them the app is signed only.
  notarize: true
dmg:
  title: createflow Dongle
win:
  # nsis is the direct download and stays unsigned, so SmartScreen warns on first launch.
  # The Store package (appx) is what gets rid of that warning — the Store signs it after
  # certification, so we need no certificate of our own. It is a separate target because
  # makeappx comes from the Windows SDK and the build fails outside Windows; putting it here
  # would break dist:win on macOS. Build it on Windows with `npm run dist:win:store`.
  target: [nsis]
# Store identity, taken from Partner Center (Product identity, store ID 9P014D85B5KV). These
# three values must match exactly or the upload is rejected.
appx:
  identityName: SnkelMediaMerch.createflowDongle
  publisher: CN=F7DDEDEE-661F-4750-8883-4E734CD5623C
  publisherDisplayName: Sünkel Media & Merch
  applicationId: createflowDongle
  displayName: createflow Dongle
  languages: [de-DE, en-US]
nsis:
  oneClick: true
  perMachine: false
# Swaps the AppImage runtime for one that doesn't need libfuse2 (see the script).
afterAllArtifactBuild: scripts/appimage-runtime.cjs
linux:
  # AppImage only; the deb target (fpm) produces an empty archive when built on macOS.
  target: [AppImage]
  executableName: createflow-dongle
  category: Utility
  maintainer: Sünkel Media & Merch
