# createflow dongle: BLE HID bridge.
# Central + HID-over-GATT client towards the keyboard, USB HID device towards the host.

# --- Bluetooth ---
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_HOGP=y
CONFIG_BT_ATT_TX_COUNT=5
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Scan for devices advertising the HID service (0x1812) and connect automatically
CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1

# Persist the bond so the keyboard is found again after a power cycle
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_NVS=y

# The dongle initiates pairing
CONFIG_BT_GATT_AUTO_SEC_REQ=y
CONFIG_BT_BONDABLE=y

CONFIG_BT_DEVICE_NAME="createflow Dongle"

# --- USB (usbd stack) ---
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_USBD_CDC_ACM_CLASS=y
# The board enables CDC_ACM_SERIAL_INITIALIZE_AT_BOOT by default, which brings up its own
# USB device (CDC ACM only) before main() and claims the controller. Zephyr documents that
# option as meant for applications with no other USB features. We register HID and CDC ACM
# ourselves in usb_hid.c.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Needed to read the baud rate set by the host (dfu_trigger.c) and to reboot
CONFIG_UART_LINE_CTRL=y
CONFIG_REBOOT=y

# --- Stacks and logging ---
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=1024
CONFIG_LOG=y
# Log over the USB serial port. RTT would need a debugger, which a bare USB stick lacks.
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=4096
